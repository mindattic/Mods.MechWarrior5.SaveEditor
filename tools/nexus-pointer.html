<!doctype html>
<!-- What NexusMods ships instead of the editor's .exe (which it quarantines): one link to the GitHub download, in the
     editor's own look. Self-contained. The publish workflow fills in {{VERSION}} and {{REPO}}. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MW5 Save Editor {{VERSION}}</title>
<style>
  :root { --base: #0d1014; --void: #080a0d; --panel: #161b22; --line: #2a323d; --text: #e6e9ee; --muted: #9aa4b2; --accent: #f2a92f; --accent-hot: #ffc561; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: var(--void); color: var(--text); font: 17px/1.5 "Rajdhani", "Segoe UI", system-ui, sans-serif; }
  main { width: 100%; max-width: 560px; padding: 34px 32px; text-align: center; background: var(--panel);
         border: 1px solid var(--line); position: relative;
         clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px); }
  main::before, main::after { content: ""; position: absolute; width: 22px; height: 3px; background: var(--accent); }
  main::before { top: 8px; left: -2px; transform: rotate(-45deg); }
  main::after { bottom: 8px; right: -2px; transform: rotate(-45deg); }
  .brand { margin: 0 0 22px; font-size: 22px; font-weight: 700; letter-spacing: .02em; color: var(--muted); }
  .brand b { color: var(--accent); }
  a { display: inline-block; padding: 14px 30px; background: var(--accent); color: #14100a; font-weight: 800; font-size: 18px;
      letter-spacing: .06em; text-transform: uppercase; text-decoration: none;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  a:hover, a:focus-visible { background: var(--accent-hot); outline: none; }
</style>
</head>
<body>
<main>
  <p class="brand"><b>MechWarrior 5</b> // Save Editor {{VERSION}}</p>
  <a href="https://github.com/{{REPO}}/releases/latest">Download from GitHub</a>
</main>
</body>
</html>
