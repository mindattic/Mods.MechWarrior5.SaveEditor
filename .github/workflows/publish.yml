name: Publish to NexusMods

# One mod, two pages: the same release zip goes to every target in nexus.json
# (MechWarrior 5: Mercenaries and MechWarrior 5: Clans).

on:
  release:
    types: [published]

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Read nexus.json targets
        id: read
        run: |
          missing=$(jq -r '[.targets[] | select((.fileId // 0) == 0) | .game] | join(", ")' nexus.json)
          if [ -n "$missing" ]; then
            echo "::error::nexus.json has no fileId for: $missing (upload the first file by hand, then fill it in)"
            exit 1
          fi
          echo "matrix=$(jq -c '{include: .targets}' nexus.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --pattern '*.zip' --dir .

      - name: Resolve zip, version and category
        id: zip
        run: |
          echo "path=$(ls *.zip | head -n1)" >> "$GITHUB_OUTPUT"
          version="${{ github.event.release.tag_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "category=$(jq -r '.category // "main"' nexus.json)" >> "$GITHUB_OUTPUT"

      - name: Upload to ${{ matrix.game }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          # The upload API wants the global "Unique Mod ID" (the page's Advanced panel), not the page number.
          mod_id: ${{ matrix.modUid || matrix.modId }}
          file_id: ${{ matrix.fileId }}
          filename: ${{ steps.zip.outputs.path }}
          version: ${{ steps.zip.outputs.version }}
          category: ${{ steps.zip.outputs.category }}
          changelog: ${{ github.event.release.body }}
